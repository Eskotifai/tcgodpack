<div class="login-container">
  <h2>Iniciar Sesión</h2>

  <form (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Correo:</label>
      <input type="text" id="email" name="email" [(ngModel)]="credentials.email" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required>
    </div>

    <button type="submit">Ingresar</button>
    <button type="button" routerLink="/signup">Crear perfil</button>
  </form>

  @if (errorMessage) {
    <p class="error-message">{{ errorMessage }}</p>
  }
</div>
