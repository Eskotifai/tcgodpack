<!-- signup.component.html -->
<div class="auth-container">
  <div class="auth-box">
    <h2>Crear Cuenta</h2>

    <form [formGroup]="signupForm" (ngSubmit)="alRegistrar()">
      <div class="form-group">
        <label for="name">Nombre Completo:</label>
        <input type="text" id="name" formControlName="name" required placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" formControlName="email" required placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" formControlName="password" required placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="signupForm.invalid">Registrarse</button>
    </form>

    @if (errorMessage) {
      <div class="error-alert">{{ errorMessage }}</div>
    }

    <p class="toggle-text">
      ¿Ya tienes una cuenta?
      <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
